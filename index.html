<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<title>🌸 AI Tag — Maria vs Ameer 🤖</title>
<style>
  :root{
    --pink:#ff5fa2; --pink-glow:#ff9ed1; --pink-deep:#c2186b;
    --blue:#4d7cff; --blue-glow:#9ec0ff; --blue-deep:#1a3fb0;
    --bg0:#1a0b2e; --bg1:#2d1456; --bg2:#3a1d6e;
    --gold:#ffd24a; --mint:#5ff0c0; --box:#c98a4b; --box-d:#8a5a2b;
    --wall:#6a6480; --wall-d:#403b54;
    --panel:rgba(255,255,255,.07); --panelB:rgba(255,255,255,.16);
    --ink:#fff5fb; --ink-soft:#d8c9ee;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:'Baloo 2','Comic Sans MS',system-ui,'Segoe UI',sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,var(--bg2),var(--bg1) 55%,var(--bg0));
    color:var(--ink); height:100%; display:flex; flex-direction:column;
    align-items:center; overflow:hidden; user-select:none;
  }
  header{width:100%; text-align:center; padding:8px 6px 4px;}
  h1{margin:0; font-size:clamp(18px,5vw,30px); letter-spacing:.5px;
     text-shadow:0 2px 10px rgba(255,95,162,.4);}
  h1 .vs{color:var(--gold); font-size:.7em;}
  .legend{font-size:clamp(10px,3vw,13px); color:var(--ink-soft); margin-top:2px;}
  .legend b{color:var(--pink);} .legend i{color:var(--blue); font-style:normal;}

  .hud{width:100%; max-width:560px; display:flex; gap:6px; padding:4px 8px;
       justify-content:center; flex-wrap:wrap;}
  .chip{background:var(--panel); border:1px solid var(--panelB); border-radius:14px;
        padding:5px 11px; font-size:clamp(11px,3.2vw,14px); display:flex; gap:6px;
        align-items:center; backdrop-filter:blur(6px);}
  .chip b{font-size:1.15em;}
  .chip.lvl b{color:var(--gold);} .chip.esc b{color:var(--pink);} .chip.tag b{color:var(--blue);}
  .chip.time b{color:var(--mint);}

  .stage{position:relative; margin:6px auto 0; width:min(94vw,520px);
          aspect-ratio:1/1; max-height:62vh;}
  canvas{position:absolute; inset:0; width:100%; height:100%;
          border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.45),
          inset 0 0 0 3px rgba(255,255,255,.06); touch-action:none;}

  .bigLevel{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
    font-weight:800; z-index:6; opacity:0;}
  .bigLevel .n{font-size:clamp(60px,22vw,150px); color:var(--gold);
    text-shadow:0 4px 0 var(--box-d),0 0 30px rgba(255,210,74,.6); line-height:1;}
  .bigLevel .s{font-size:clamp(14px,4vw,22px); color:var(--ink); margin-top:4px;}

  .tagFx{position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; pointer-events:none; z-index:7; opacity:0;}
  .tagFx span{font-size:clamp(44px,15vw,110px); font-weight:900; color:#fff;
    text-shadow:0 0 14px var(--blue),0 0 30px var(--blue-glow),0 4px 0 var(--blue-deep);
    transform:rotate(-8deg);}
  .resultFx{position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; pointer-events:none; z-index:7; opacity:0;
    font-size:clamp(26px,8vw,52px); font-weight:900;
    text-shadow:0 3px 12px rgba(0,0,0,.5);}

  .controls{display:flex; gap:10px; margin-top:8px; align-items:center; flex-wrap:wrap; justify-content:center;}
  button{font-family:inherit; font-weight:700; cursor:pointer; border:none;
    border-radius:14px; padding:9px 16px; font-size:14px; color:#fff;
    background:linear-gradient(180deg,var(--pink),var(--pink-deep));
    box-shadow:0 5px 0 var(--pink-deep),0 8px 18px rgba(255,95,162,.4);
    transition:transform .08s, box-shadow .08s;}
  button:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink-deep);}
  button.ghost{background:linear-gradient(180deg,#5a4a78,#372a52);
    box-shadow:0 5px 0 #2a2040,0 8px 18px rgba(0,0,0,.3);}
  button.ghost:active{box-shadow:0 2px 0 #2a2040;}
  .foot{font-size:11px; color:var(--ink-soft); opacity:.7; margin:6px 0 8px;}
</style>
</head>
<body>
<header>
  <h1>🌸 Maria <span class="vs">vs</span> Ameer 🤖</h1>
  <div class="legend"><b>● Maria</b> runs (Q-learning) &nbsp;·&nbsp; <i>● Ameer</i> chases (BFS) &nbsp;·&nbsp; survive 15s!</div>
</header>

<div class="hud">
  <div class="chip lvl">Level <b id="cLvl">1</b></div>
  <div class="chip time">⏱ <b id="cTime">15.0</b>s</div>
  <div class="chip esc">🌸 Escapes <b id="cEsc">0</b></div>
  <div class="chip tag">🤖 Tags <b id="cTag">0</b></div>
  <div class="chip">🏁 Rounds <b id="cRound">0</b></div>
</div>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="bigLevel" id="bigLevel"><div class="n" id="blN">1</div><div class="s" id="blS">Get ready!</div></div>
  <div class="tagFx" id="tagFx"><span>TAG! 🎯</span></div>
  <div class="resultFx" id="resultFx"></div>
</div>

<div class="controls">
  <button id="btnPause" class="ghost">⏸ Pause</button>
  <button id="btnSpeed" class="ghost">⏩ Speed: 1×</button>
  <button id="btnReset">↻ Restart</button>
</div>
<div class="foot">Brown boxes push · gray walls block · Maria gets smarter every round</div>

<script>
"use strict";
/* ===================== SETUP ===================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const GRID = 13;                 // cells per side
let CELL = 40;                   // pixel size, set on resize
const SURVIVE = 15;              // seconds to survive a level

function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CELL = r.width / GRID;
  for(const b of [maria,ameer]) snap(b);
}
addEventListener('resize', resize);

/* ===================== GAME STATE ===================== */
// grid cell codes: 0 empty, 1 wall, 2 box
let grid = [];
let level = 1, rounds = 0, escapes = 0, tags = 0;
let timeLeft = SURVIVE;
let running = true, paused = false, speed = 1;
let roundOver = false;
let particles = [];

const inB = (x,y)=> x>=0 && y>=0 && x<GRID && y<GRID;
const cellAt = (x,y)=> inB(x,y) ? grid[y][x] : 1;
const key = (x,y)=> x+','+y;
const rnd = n => (Math.random()*n)|0;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// A bot has a logical cell (cx,cy), a smooth pixel pos, and a move target.
function makeBot(color){
  return {cx:0,cy:0, px:0,py:0, tx:0,ty:0, moving:false, prog:0,
    walk:0, color, dir:{x:0,y:1}};
}
const maria = makeBot('pink');   // runner
const ameer = makeBot('blue');   // tagger
const MOVE_TIME_MARIA = 0.14;     // seconds per cell step (Maria - slightly faster)
const MOVE_TIME_AMEER = 0.22;     // seconds per cell step (Ameer - slower so Maria can escape)
const snap = b =>{ b.px=(b.cx+0.5)*CELL; b.py=(b.cy+0.5)*CELL; };

/* ===================== LEVEL BUILD ===================== */
function emptyGrid(){ return Array.from({length:GRID},()=>new Array(GRID).fill(0)); }

function buildLevel(){
  grid = emptyGrid();
  const mid = (GRID-1)/2;
  // start positions: near center, 3 cells apart
  maria.cx = Math.floor(mid-1); maria.cy = Math.floor(mid);
  ameer.cx = Math.floor(mid+2); ameer.cy = Math.floor(mid);
  const reserved = new Set();
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    reserved.add(key(maria.cx+dx,maria.cy+dy));
    reserved.add(key(ameer.cx+dx,ameer.cy+dy));
  }
  // obstacle counts scale with level (level 1 = empty)
  const wallCount = Math.min((level-1)*9, Math.floor(GRID*GRID*0.30));
  const boxCount  = level>=2 ? Math.min(level+1, 9) : 0;
  let placed = 0, guard = 0;
  while(placed<wallCount && guard++<1500){
    const x = rnd(GRID), y = rnd(GRID);
    if(reserved.has(key(x,y)) || grid[y][x]!==0) continue;
    grid[y][x] = 1;
    if(!pathOk()){ grid[y][x] = 0; continue; } // keep arena connected
    placed++;
  }
  placed = 0; guard = 0;
  while(placed<boxCount && guard++<1000){
    const x = rnd(GRID), y = rnd(GRID);
    if(reserved.has(key(x,y)) || grid[y][x]!==0) continue;
    grid[y][x] = 2; placed++;
  }
  for(const b of [maria,ameer]){
    snap(b); b.tx=b.cx; b.ty=b.cy; b.moving=false; b.prog=0; b.walk=0; b.dir={x:0,y:1};
  }
  timeLeft = SURVIVE; roundOver = false; particles=[]; mariaPrev=null;
}

// flood fill: ensure ameer reachable from maria & enough open space
function pathOk(){
  const seen = new Set(), q=[[maria.cx,maria.cy]]; seen.add(key(maria.cx,maria.cy));
  let open=0, head=0;
  while(head<q.length){
    const [x,y]=q[head++]; open++;
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;
      if(inB(nx,ny)&&grid[ny][nx]!==1&&!seen.has(key(nx,ny))){seen.add(key(nx,ny));q.push([nx,ny]);}}
  }
  return seen.has(key(ameer.cx,ameer.cy)) && open>GRID*GRID*0.55;
}

/* ===================== BFS (Ameer's brain) ===================== */
// first step direction from (sx,sy) toward (gx,gy); walls & boxes block path
function bfsStep(sx,sy,gx,gy){
  const prev = new Map(), seen=new Set([key(sx,sy)]);
  const q=[[sx,sy]]; let head=0, found=false;
  while(head<q.length){
    const [x,y]=q[head++];
    if(x===gx&&y===gy){found=true;break;}
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(inB(nx,ny)&&cellAt(nx,ny)===0&&!seen.has(k)){
        seen.add(k); prev.set(k,key(x,y)); q.push([nx,ny]);}}
  }
  if(found){ // walk path back to the first step out of start
    let cur=key(gx,gy), p=prev.get(cur);
    if(p===undefined) return greedy(sx,sy,gx,gy);
    while(p!==key(sx,sy)){ cur=p; p=prev.get(cur); if(p===undefined)return greedy(sx,sy,gx,gy); }
    const [cx,cy]=cur.split(',').map(Number);
    return {x:cx-sx, y:cy-sy};
  }
  // boxes/walls fully block a clean path -> greedy step (may push a box)
  return greedy(sx,sy,gx,gy);
}
function greedy(sx,sy,gx,gy){
  const cand = DIRS.map(([dx,dy])=>({x:dx,y:dy,
      d:Math.abs(sx+dx-gx)+Math.abs(sy+dy-gy)}))
    .filter(c=>inB(sx+c.x,sy+c.y)&&cellAt(sx+c.x,sy+c.y)!==1)
    .sort((a,b)=>a.d-b.d);
  return cand[0]||null;
}

/* ===================== Q-LEARNING (Maria's brain) ===================== */
const Q = new Map();             // state -> array of 5 action values
const ACTS=[[1,0],[-1,0],[0,1],[0,-1],[0,0]];
const ALPHA=0.35, GAMMA=0.9; let eps=0.35;
function qState(){
  const dx=Math.sign(ameer.cx-maria.cx), dy=Math.sign(ameer.cy-maria.cy);
  let blocked='';
  for(const[ax,ay]of DIRS){const c=cellAt(maria.cx+ax,maria.cy+ay); blocked+=(c===1?'1':c===2?'b':'0');}
  const dist=Math.abs(ameer.cx-maria.cx)+Math.abs(ameer.cy-maria.cy);
  const db = dist<=2?'n':dist<=5?'m':'f';
  return dx+','+dy+'|'+blocked+'|'+db;
}
function qGet(s){ if(!Q.has(s)) Q.set(s,[0,0,0,0,0]); return Q.get(s); }
function qChoose(s){
  const v=qGet(s);
  if(Math.random()<eps) return rnd(5);
  let best=0; for(let i=1;i<5;i++) if(v[i]>v[best]) best=i; return best;
}
function qUpdate(s,a,r,s2){
  const v=qGet(s), mx=Math.max(...qGet(s2));
  v[a]+= ALPHA*(r+GAMMA*mx - v[a]);
}
let mariaPrev=null;              // {s,a,dist}
const toDir=a=>({x:ACTS[a][0],y:ACTS[a][1]});
const manh=()=>Math.abs(ameer.cx-maria.cx)+Math.abs(ameer.cy-maria.cy);
function escScore(a){const nx=maria.cx+ACTS[a][0],ny=maria.cy+ACTS[a][1];
  if(!inB(nx,ny)||cellAt(nx,ny)===1)return -99;
  return Math.abs(ameer.cx-nx)+Math.abs(ameer.cy-ny);}

/* ===================== MOVE / PUSH MECHANICS ===================== */
function occupied(x,y,self){
  const other = self===maria?ameer:maria;
  return other.cx===x && other.cy===y || other.tx===x && other.ty===y;
}
// attempt to move bot by direction d; handles box pushing. returns true if it started moving.
function tryStep(bot,d){
  if(d.x===0&&d.y===0) return false;
  const nx=bot.cx+d.x, ny=bot.cy+d.y;
  if(!inB(nx,ny)) return false;
  const c=cellAt(nx,ny);
  if(c===1) return false;                       // wall
  if(c===2){                                    // box: try to push it one cell
    const bx=nx+d.x, by=ny+d.y;
    if(!inB(bx,by)||cellAt(bx,by)!==0||occupied(bx,by,bot)) return false;
    grid[ny][nx]=0; grid[by][bx]=2;
    spawnSparkle((nx+0.5)*CELL,(ny+0.5)*CELL,'box');
  }
  bot.dir=d; bot.tx=nx; bot.ty=ny; bot.moving=true; bot.prog=0;
  return true;
}

/* ===================== DECISIONS (called when a bot lands on a cell) ===================== */
function decideAmeer(){
  const step=bfsStep(ameer.cx,ameer.cy,maria.cx,maria.cy);
  if(step) tryStep(ameer,step);
}
function decideMaria(){
  const s=qState();
  if(mariaPrev){                       // learn from previous step's outcome
    const nd=manh();
    let r=(nd-mariaPrev.dist)+0.2;      // reward growing distance + survival
    if(nd<=1) r-=5;                     // danger penalty
    qUpdate(mariaPrev.s, mariaPrev.a, r, s);
  }
  let a=qChoose(s);
  if(!tryStep(maria,toDir(a))){         // chosen move blocked -> best legal escape
    const order=[0,1,2,3].sort((i,j)=>escScore(j)-escScore(i));
    let moved=false;
    for(const i of order){ if(tryStep(maria,toDir(i))){a=i;moved=true;break;} }
    if(!moved) a=4;                     // stuck -> stay
  }
  mariaPrev={s,a,dist:manh()};
}

/* ===================== UPDATE LOOP ===================== */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05)*speed;
  if(running && !paused) update(dt);
  render();
  requestAnimationFrame(loop);
}
function update(dt){
  if(!roundOver){
    timeLeft-=dt;
    advance(maria,dt,decideMaria);
    advance(ameer,dt,decideAmeer);
    const d=Math.hypot(maria.px-ameer.px, maria.py-ameer.py);
    if(d < CELL*0.62) onTag();
    else if(timeLeft<=0) onEscape();
    if(maria.moving && Math.random()<0.25) spawnSparkle(maria.px,maria.py,'pink');
  }
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  updateHUD();
}
// smooth movement; calls decide() when bot needs a new target
function advance(bot,dt,decide){
  if(!bot.moving){ decide(); if(!bot.moving) return; }
  const mt = bot===maria ? MOVE_TIME_MARIA : MOVE_TIME_AMEER;
  bot.prog += dt/mt;
  bot.walk += dt*14;
  if(bot.prog>=1){
    bot.cx=bot.tx; bot.cy=bot.ty; bot.prog=0; bot.moving=false; snap(bot);
  } else {
    const sx=(bot.cx+0.5)*CELL, sy=(bot.cy+0.5)*CELL;
    const ex=(bot.tx+0.5)*CELL, ey=(bot.ty+0.5)*CELL;
    bot.px=sx+(ex-sx)*bot.prog; bot.py=sy+(ey-sy)*bot.prog;
  }
}

/* ===================== ROUND END ===================== */
function onTag(){
  roundOver=true; tags++; rounds++;
  if(mariaPrev) qUpdate(mariaPrev.s,mariaPrev.a,-10,qState());
  eps=Math.max(0.08, eps*0.90);
  burst(maria.px,maria.py,'pink',26);
  flash($('tagFx'),1400);
  showResult('🤖 Ameer wins!','var(--blue)');
  setTimeout(nextRound,1700);
}
function onEscape(){
  roundOver=true; escapes++; rounds++;
  if(mariaPrev) qUpdate(mariaPrev.s,mariaPrev.a,12,qState());
  eps=Math.max(0.08, eps*0.92);
  burst(maria.px,maria.py,'gold',34);
  showResult('🌸 Maria escaped!','var(--pink)');
  setTimeout(nextRound,1700);
}
function nextRound(){ level++; buildLevel(); showBigLevel(); }

/* ===================== PARTICLES / SPARKLES ===================== */
const COLORS={pink:'#ff9ed1',blue:'#9ec0ff',gold:'#ffd24a',box:'#e0b070',mint:'#5ff0c0'};
function spawnSparkle(x,y,kind){
  particles.push({x,y,vx:(Math.random()-0.5)*30,vy:-Math.random()*40-10,
    life:0.5+Math.random()*0.4, max:0.9, c:COLORS[kind]||'#fff', r:2+Math.random()*2});
}
function burst(x,y,kind,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, sp=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,
      life:0.6+Math.random()*0.6,max:1.2,c:COLORS[kind]||'#fff',r:2+Math.random()*3});}
}

/* ===================== RENDER ===================== */
function render(){
  const W=cv.getBoundingClientRect().width;
  ctx.clearRect(0,0,W,W);
  roundRect(0,0,W,W,18); ctx.fillStyle='#241043'; ctx.fill();
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const c=grid[y][x], px=x*CELL, py=y*CELL;
    if(c===0){ ctx.fillStyle=((x+y)&1)?'rgba(255,255,255,.025)':'rgba(255,255,255,.06)';
      ctx.fillRect(px,py,CELL,CELL); }
    else if(c===1) drawWall(px,py);
    else if(c===2) drawBox(px,py);
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c;
    ctx.beginPath(); drawStar(p.x,p.y,p.r*1.6,p.r*0.7,5); ctx.fill();
  }
  ctx.globalAlpha=1;
  drawBot(ameer,'#4d7cff','#1a3fb0','#9ec0ff','🤖');
  drawBot(maria,'#ff5fa2','#c2186b','#ff9ed1','🌸');
}
function drawWall(px,py){
  const m=2; roundRect(px+m,py+m,CELL-2*m,CELL-2*m,5);
  ctx.fillStyle='#6a6480'; ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.fillRect(px+m,py+m,CELL-2*m,(CELL-2*m)*0.32);
  ctx.strokeStyle='#403b54'; ctx.lineWidth=2; ctx.stroke();
}
function drawBox(px,py){
  const m=CELL*0.12; roundRect(px+m,py+m,CELL-2*m,CELL-2*m,6);
  const g=ctx.createLinearGradient(px,py,px,py+CELL);
  g.addColorStop(0,'#d99a5b'); g.addColorStop(1,'#a86a33');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px+m,py+m); ctx.lineTo(px+CELL-m,py+CELL-m);
  ctx.moveTo(px+CELL-m,py+m); ctx.lineTo(px+m,py+CELL-m);
  ctx.strokeStyle='rgba(138,90,43,.6)'; ctx.lineWidth=2; ctx.stroke();
}
function drawBot(b,fill,deep,glow,emo){
  const bob = b.moving ? Math.abs(Math.sin(b.walk))*CELL*0.10 : 0;
  const x=b.px, y=b.py-bob, R=CELL*0.34;
  ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(b.px,b.py+R*0.85,R*0.9,R*0.4,0,0,7); ctx.fill();
  ctx.globalAlpha=1;
  const gr=ctx.createRadialGradient(x,y,R*0.4,x,y,R*1.8);
  gr.addColorStop(0,glow+'66'); gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,R*1.8,0,7); ctx.fill();
  // legs
  const ls=Math.sin(b.walk)*R*0.4;
  ctx.strokeStyle=deep; ctx.lineWidth=R*0.28; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-R*0.35,y+R*0.6); ctx.lineTo(x-R*0.35+ls*0.4,y+R*1.05);
  ctx.moveTo(x+R*0.35,y+R*0.6); ctx.lineTo(x+R*0.35-ls*0.4,y+R*1.05); ctx.stroke();
  // body
  const bg=ctx.createRadialGradient(x-R*0.3,y-R*0.3,R*0.2,x,y,R);
  bg.addColorStop(0,glow); bg.addColorStop(0.55,fill); bg.addColorStop(1,deep);
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
  ctx.strokeStyle=deep; ctx.lineWidth=2; ctx.stroke();
  // eyes (look toward movement)
  const ex=b.dir.x*R*0.16, ey=b.dir.y*R*0.16;
  for(const s of [-1,1]){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*R*0.34,y-R*0.12,R*0.22,0,7); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(x+s*R*0.34+ex,y-R*0.12+ey,R*0.11,0,7); ctx.fill();
  }
  ctx.font=`${R*0.95}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.globalAlpha=0.9; ctx.fillText(emo,x,y-R*1.55); ctx.globalAlpha=1;
}
function drawStar(cx,cy,outer,inner,points){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){const r=i&1?inner:outer, a=i*Math.PI/points-Math.PI/2;
    const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.closePath();
}
function roundRect(x,y,w,h,r){ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}

/* ===================== HUD / FX OVERLAYS ===================== */
function updateHUD(){
  $('cLvl').textContent=level;
  $('cTime').textContent=Math.max(0,timeLeft).toFixed(1);
  $('cEsc').textContent=escapes;
  $('cTag').textContent=tags;
  $('cRound').textContent=rounds;
}
function countObs(){let n=0;for(const row of grid)for(const c of row)if(c)n++;return n;}
function showBigLevel(){
  $('blN').textContent=level;
  $('blS').textContent = level===1?'Empty arena!':`${countObs()} obstacles · run, Maria!`;
  flash($('bigLevel'),1100);
}
function showResult(txt,color){const el=$('resultFx'); el.textContent=txt; el.style.color=color; flash(el,1500);}
function flash(el,ms){
  el.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.08)',offset:.25},
    {opacity:1,transform:'scale(1)',offset:.7},{opacity:0,transform:'scale(1.02)'}],
    {duration:ms,easing:'cubic-bezier(.2,.9,.3,1)'});
}

/* ===================== CONTROLS ===================== */
$('btnPause').onclick=()=>{paused=!paused;
  $('btnPause').textContent=paused?'▶ Resume':'⏸ Pause';};
$('btnSpeed').onclick=()=>{speed=speed===1?2:speed===2?4:1;
  $('btnSpeed').textContent='⏩ Speed: '+speed+'×';};
$('btnReset').onclick=()=>{ level=1;rounds=0;escapes=0;tags=0;eps=0.35;Q.clear();
  buildLevel(); showBigLevel(); };

/* ===================== BOOT ===================== */
buildLevel(); resize(); showBigLevel();
requestAnimationFrame(loop);
</script>
